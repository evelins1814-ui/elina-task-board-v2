<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Задачи — Элина</title>
<style>
:root{--navy:#102a43;--blue:#1677ff;--bg:#f4f7fb;--line:#d9e2ec;--muted:#6b7c93;--green:#16855b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:14px Segoe UI,Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:240px;background:linear-gradient(180deg,#102a43,#0b1f33);padding:25px 16px}.brand{font-size:20px;font-weight:750;color:#fff;margin:0 12px 30px}.brand span{color:#69aaff}.side a{display:block;color:#bed2e7;text-decoration:none;padding:12px 14px;border-radius:10px;margin:5px 0}.side a.active,.side a:hover{background:#1d4e7e;color:#fff}.main{flex:1;padding:28px 34px;max-width:1350px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:23px}.eyebrow{color:var(--blue);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.title{font-size:30px;margin:6px 0}.sub{color:var(--muted);margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--navy);padding:10px 14px;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:8px}.board{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar h2{margin:0;font-size:18px}.filters{display:flex;gap:8px;flex-wrap:wrap}input,select{border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--navy);background:#fff}input[type=search]{min-width:260px}.list{display:flex;flex-direction:column;gap:8px}.task{display:flex;align-items:flex-start;gap:10px;border:1px solid #e2eaf2;border-radius:11px;padding:13px;background:#fff}.task.dragging{opacity:.45}.grip{width:18px;color:#9aadc1;cursor:grab;font-size:17px}.check{appearance:none;width:19px;height:19px;border:2px solid #9fb2c7;border-radius:50%;margin:0;cursor:pointer;position:relative;flex:none;background:#fff}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:'✓';position:absolute;color:#fff;font-size:13px;left:2px;top:-2px}.content{flex:1;min-width:0}.task-title{font-weight:650;line-height:1.4;overflow-wrap:anywhere}.task.done{background:#f7fafc}.task.done .task-title{text-decoration:line-through;color:#8a99a8}.arrow{width:28px;height:28px;border:0;border-radius:7px;background:#f1f6fc;color:var(--blue);font-size:19px;cursor:pointer;flex:none}.arrow.open{transform:rotate(90deg)}.subtasks{margin:10px 0 0;padding:10px 0 0 26px;border-top:1px solid #edf2f7;display:flex;flex-direction:column;gap:8px}.subtasks.hidden{display:none}.subtask{display:flex;align-items:center;gap:8px;color:#48627b;font-size:13px}.subtask .check{width:16px;height:16px;border-width:1.5px}.add-sub{display:flex;align-items:center;gap:10px;padding:7px 0;border:0;background:transparent;color:var(--blue);font-size:13px;cursor:pointer}.add-sub .plus{width:19px;height:19px;border:2px solid #9fb2c7;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}.add{margin-top:14px;border:1px dashed #a9caff;border-radius:10px;padding:13px;text-align:center;color:#4f7194;background:#fbfdff;cursor:pointer;width:100%}.empty{display:none;text-align:center;padding:25px;color:var(--muted)}@media(max-width:850px){.side{display:none}.main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.top{display:block}.actions{margin-top:15px}}@media(max-width:500px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">Work<span>Desk</span></div><nav><a class="active" data-section="work" href="#">Все задачи</a><a data-section="personal" href="#">Личное</a><a data-section="done" href="#">Выполненные</a></nav></aside><main class="main"><header class="top"><div><div class="eyebrow">Рабочий стол</div><h1 class="title" id="pageTitle">Задачи</h1><p class="sub">Изменяйте приоритет перетаскиванием. Данные сохраняются в этом браузере.</p></div><div class="actions"><button class="btn" id="collapse">Свернуть все</button><button class="btn" id="expand">Развернуть все</button><button class="btn primary" id="newTask">+ Новая задача</button></div></header><section class="stats"><div class="stat"><small>Всего задач</small><strong id="total">0</strong></div><div class="stat"><small>Активные</small><strong id="active">0</strong></div><div class="stat"><small>Подзадачи</small><strong id="subTotal">0</strong></div><div class="stat"><small>Выполнено</small><strong id="completed">0</strong></div></section><section class="board"><div class="toolbar"><h2 id="sectionTitle">Приоритет задач</h2><div class="filters"><input type="search" id="search" placeholder="Поиск по задачам"><select id="filter"><option value="all">Все</option><option value="open">Активные</option><option value="done">Выполненные</option></select></div></div><div id="list" class="list"></div><button class="add" id="newTaskBottom">+ Добавить новую задачу</button><div class="empty" id="empty">Задачи не найдены</div></section></main></div>
<script>
const initial=[['work','Подумать над задачей Ольги',[]],['work','Сколково — разобраться с их запросом',[]],['work','Ростелеком — пополнить счет',[]],['work','Настоящие полы — главный бухгалтер',[]],['work','Настоящие полы — МОП',['Доделать лендинг','Попросить Данила Лендинг внести изменения','Выбрать 20 подходящих кандидатов для прозвона','Прописать, как идет воронка для МОПов','Изменить видео, которое смотрят менеджеры']],['work','Муверсы — главный бухгалтер',['Транскрибация брифа','Аналитика','Созвон с операционным директором','Попробовать поговорить с подходящими кандидатами']],['work','Оберон — инженеры-проектировщики',[]],['work','Итагро — менеджеры склада',['Посмотреть, есть ли еще подходящие кандидаты']],['work','Ингери Логистик — крановщик',['Подготовить документы','Запросить реквизиты юрлица','Подготовить типовой ГПХ','Узнать, во сколько отходит судно']],['work','Ответить на отзыв Софии на Яндексе',[]]];
let tasks=JSON.parse(localStorage.getItem('elinaTasksFinal')||'null')||initial.map((x,i)=>({id:Date.now()+i,section:x[0],title:x[1],subs:x[2].map(y=>({text:y,done:false})),done:false,open:false}));let current='work',dragged=null,list=document.getElementById('list');
function save(){localStorage.setItem('elinaTasksFinal',JSON.stringify(tasks))}function addSub(t){let x=prompt('Введите новую подзадачу');if(x){t.subs.push({text:x,done:false});t.open=true;save();render()}}function card(t){let e=document.createElement('div');e.className='task'+(t.done?' done':'');e.draggable=true;e.dataset.id=t.id;e.innerHTML='<span class="grip">⠿</span><input class="check main-check" type="checkbox" '+(t.done?'checked':'')+'><div class="content"><div class="task-title"></div></div>';e.querySelector('.task-title').textContent=t.title;let c=e.querySelector('.content'),s=document.createElement('div');s.className='subtasks'+(t.open?'':' hidden');t.subs.forEach(x=>{let l=document.createElement('label');l.className='subtask';l.innerHTML='<input class="check" type="checkbox" '+(x.done?'checked':'')+'><span></span>';l.querySelector('span').textContent=x.text;l.querySelector('input').onchange=a=>{x.done=a.target.checked;save()};s.appendChild(l)});let b=document.createElement('button');b.className='add-sub';b.innerHTML='<span class="plus">+</span><span>Добавить подзадачу</span>';b.onclick=()=>addSub(t);s.appendChild(b);c.appendChild(s);let a=document.createElement('button');a.className='arrow'+(t.open?' open':'');a.textContent='›';a.onclick=()=>{t.open=!t.open;save();render()};e.appendChild(a);e.querySelector('.main-check').onchange=x=>{t.done=x.target.checked;save();render()};e.ondragstart=()=>{dragged=t;e.classList.add('dragging')};e.ondragend=()=>{e.classList.remove('dragging');save();render()};e.ondragover=x=>{x.preventDefault();let z=[...list.children].find(q=>q!==e&&x.clientY<q.getBoundingClientRect().top+q.offsetHeight/2);if(z){let ti=tasks.findIndex(q=>q.id==z.dataset.id),di=tasks.findIndex(q=>q.id==dragged.id);tasks.splice(di,1);tasks.splice(ti,0,dragged);render()}};return e}function render(){list.innerHTML='';let q=search.value.toLowerCase(),f=filter.value,shown=tasks.filter(t=>(current==='done'?t.done:t.section===current)&&(!q||t.title.toLowerCase().includes(q)||t.subs.some(s=>s.text.toLowerCase().includes(q)))&&(f==='all'||f==='open'&&!t.done||f==='done'&&t.done));shown.forEach(t=>list.appendChild(card(t)));empty.style.display=shown.length?'none':'block';let d=tasks.filter(t=>t.done).length;total.textContent=tasks.length;active.textContent=tasks.length-d;completed.textContent=d;subTotal.textContent=tasks.reduce((n,t)=>n+t.subs.length,0)}function addTask(){let x=prompt('Введите новую задачу');if(x){tasks.push({id:Date.now(),section:current==='personal'?'personal':'work',title:x,subs:[],done:false,open:false});save();render()}}function all(open){tasks.forEach(t=>t.open=open);save();render()}newTask.onclick=addTask;newTaskBottom.onclick=addTask;collapse.onclick=()=>all(false);expand.onclick=()=>all(true);search.oninput=render;filter.onchange=render;document.querySelectorAll('.side a').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelectorAll('.side a').forEach(x=>x.classList.remove('active'));a.classList.add('active');current=a.dataset.section;pageTitle.textContent=current==='personal'?'Личное':'Задачи';sectionTitle.textContent=current==='personal'?'Личные задачи':'Приоритет задач';render()});render();
</script>
</body></html>
